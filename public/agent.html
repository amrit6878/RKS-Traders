<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent desk · RKS Traders</title><link rel="stylesheet" href="/style.css"><style>main{max-width:1100px;margin:40px auto;padding:20px}.desk-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.agent-card{border:1px solid var(--line);border-radius:12px;margin:20px 0;padding:24px}.agent-card p{white-space:pre-wrap;overflow-wrap:anywhere}.agent-card a{color:var(--teal);text-decoration:underline}.agent-card img{display:block;max-width:100%;max-height:360px;margin:20px 0}.agent-card select,select{padding:12px;border:1px solid var(--line);border-radius:6px;background:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}#login{max-width:450px}#login button{margin-top:15px}#error{color:#a12e20}.tools{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.agent-card button{margin-top:12px}</style></head><body><header><a class="brand" href="/"><b class="logo">R.</b><strong>RKS TRADERS</strong></a><span>Agent desk</span></header><main><div class="desk-head"><div><div class="eyebrow">QUOTATION MANAGEMENT</div><h1 style="font-size:36px">Every enquiry. One place.</h1><p>Review material lists, contact customers, and keep track of the next step.</p></div><button id="logout" class="outline" hidden>Sign out</button></div><form id="login"><label>Agent access key<input id="key" type="password" autocomplete="current-password" required></label><button class="primary">Unlock desk →</button><p class="privacy">Your server administrator provides this key. It stays in memory only for this tab.</p></form><p id="error" role="alert"></p><section id="desk" hidden><div class="tools"><select id="status" aria-label="Filter requests"><option value="all">All enquiries</option><option value="new">New</option><option value="contacted">Contacted</option><option value="quoted">Quoted</option><option value="closed">Closed</option></select><button id="refresh" class="outline">Refresh</button><span id="count"></span></div><div id="requests"></div></section></main><script src="/agent.js" defer></script></body></html>
